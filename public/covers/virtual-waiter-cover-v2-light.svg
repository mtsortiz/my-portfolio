<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient (Red Tinted Light) -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff5f5" />
      <stop offset="100%" stop-color="#ffe3e6" />
    </linearGradient>

    <!-- Subtle Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#3a0f16" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Grid Pattern -->
  <g opacity="0.2" stroke="#e0909c" stroke-width="1.5">
    <path d="M0 180 H1600"/>
    <path d="M0 360 H1600"/>
    <path d="M0 540 H1600"/>
    <path d="M0 720 H1600"/>
    <path d="M200 0 V900"/>
    <path d="M400 0 V900"/>
    <path d="M600 0 V900"/>
    <path d="M800 0 V900"/>
    <path d="M1000 0 V900"/>
    <path d="M1200 0 V900"/>
    <path d="M1400 0 V900"/>
  </g>

  <!-- Connection Lines (Elegant Red) -->
  <path d="M 370 450 L 650 450" fill="none" stroke="#e11d48" stroke-width="5" stroke-linecap="round" />
  <path d="M 950 450 C 1050 450, 1070 295, 1150 295" fill="none" stroke="#e11d48" stroke-width="5" stroke-linecap="round" />
  <path d="M 950 450 C 1050 450, 1070 605, 1150 605" fill="none" stroke="#e11d48" stroke-width="5" stroke-linecap="round" />

  <!-- Client Node -->
  <g>
    <circle cx="300" cy="450" r="70" fill="#ffffff" stroke="#9f1239" stroke-width="4" filter="url(#shadow)" />
    <text x="300" y="565" fill="#9f1239" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="600" text-anchor="middle">Client CLI</text>
  </g>

  <!-- LangGraph Waiter Node -->
  <g>
    <rect x="650" y="365" width="300" height="170" rx="24" fill="#e11d48" stroke="#9f1239" stroke-width="2" filter="url(#shadow)" />
    <text x="800" y="440" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="600" text-anchor="middle">LangGraph Router &amp;</text>
    <text x="800" y="480" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="600" text-anchor="middle">Waiter Agent (Bruno)</text>
  </g>

  <!-- Chroma DB Menu RAG Node -->
  <g>
    <rect x="1150" y="195" width="200" height="200" rx="24" fill="#ffffff" stroke="#9f1239" stroke-width="3" filter="url(#shadow)" />
    <!-- Chroma logo -->
    <g transform="translate(1250, 275) scale(2.2)">
      <!-- Blue Circle -->
      <circle cx="-7.5" cy="4" r="11" fill="#3b82f6" fill-opacity="0.85" />
      <!-- Yellow Circle -->
      <circle cx="7.5" cy="4" r="11" fill="#facc15" fill-opacity="0.85" />
      <!-- Red Circle -->
      <circle cx="0" cy="-4" r="11" fill="#ef4444" fill-opacity="0.85" />
    </g>
    <text x="1250" y="440" fill="#9f1239" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" text-anchor="middle">Chroma DB</text>
    <text x="1250" y="465" fill="#9f1239" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" text-anchor="middle">menu RAG</text>
  </g>

  <!-- Notion API Node -->
  <g>
    <rect x="1150" y="505" width="200" height="200" rx="24" fill="#ffffff" stroke="#9f1239" stroke-width="3" filter="url(#shadow)" />
    <!-- Notion Logo representation -->
    <g stroke="#9f1239" stroke-width="3" fill="none" transform="translate(1250, 580) scale(2.2)">
      <rect x="-15" y="-18" width="30" height="36" rx="4" fill="#fefdfd" stroke="#9f1239" stroke-width="2"/>
      <path d="M -9 10 L -9 -10 L 9 10 L 9 -10" stroke-width="3" stroke="#9f1239" stroke-linecap="round"/>
    </g>
    <text x="1250" y="750" fill="#9f1239" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" text-anchor="middle">Notion API</text>
    <text x="1250" y="775" fill="#9f1239" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" text-anchor="middle">order reports</text>
  </g>

</svg>
