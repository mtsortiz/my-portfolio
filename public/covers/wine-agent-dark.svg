<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060b13" />
      <stop offset="100%" stop-color="#0f1d3a" />
    </linearGradient>
    
    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Grid Pattern -->
  <g opacity="0.22" stroke="#7abfff" stroke-width="1.5">
    <path d="M0 180 H1600"/>
    <path d="M0 360 H1600"/>
    <path d="M0 540 H1600"/>
    <path d="M0 720 H1600"/>
    <path d="M200 0 V900"/>
    <path d="M400 0 V900"/>
    <path d="M600 0 V900"/>
    <path d="M800 0 V900"/>
    <path d="M1000 0 V900"/>
    <path d="M1200 0 V900"/>
    <path d="M1400 0 V900"/>
  </g>

  <!-- Connection Lines (Glowing) -->
  <path d="M 370 450 L 650 450" fill="none" stroke="#8ab4f8" stroke-width="5" filter="url(#glow)" />
  <path d="M 950 450 C 1050 450, 1070 295, 1150 295" fill="none" stroke="#8ab4f8" stroke-width="5" filter="url(#glow)" />
  <path d="M 950 450 C 1050 450, 1070 605, 1150 605" fill="none" stroke="#8ab4f8" stroke-width="5" filter="url(#glow)" />

  <!-- Client Node -->
  <g>
    <circle cx="300" cy="450" r="70" fill="#0d1829" stroke="#8ab4f8" stroke-width="4" filter="url(#glow)" />
    <text x="300" y="565" fill="#c4d1ec" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="600" text-anchor="middle">Client</text>
  </g>

  <!-- FastAPI & Gemini Agent Node -->
  <g>
    <rect x="650" y="365" width="300" height="170" rx="24" fill="#162238" stroke="#8ab4f8" stroke-width="4" filter="url(#glow)" />
    <text x="800" y="440" fill="#e8eaed" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="600" text-anchor="middle">FastAPI &amp;</text>
    <text x="800" y="480" fill="#e8eaed" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="600" text-anchor="middle">Gemini Agent</text>
  </g>

  <!-- SQLite Node -->
  <g>
    <rect x="1150" y="195" width="200" height="200" rx="24" fill="#0d1829" stroke="#8ab4f8" stroke-width="3" />
    <!-- Cylinder database icon -->
    <g stroke="#8ab4f8" stroke-width="3" fill="#162238" transform="translate(1250, 275) scale(2.2)">
      <ellipse cx="0" cy="-20" rx="14" ry="4" />
      <path d="M -14 -20 L -14 -10 A 14 4 0 0 0 14 -10 L 14 -20 Z" />
      <path d="M -14 -10 L -14 0 A 14 4 0 0 0 14 0 L 14 -10 Z" />
      <path d="M -14 0 L -14 10 A 14 4 0 0 0 14 10 L 14 0 Z" />
    </g>
    <text x="1250" y="440" fill="#c4d1ec" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" text-anchor="middle">SQLite</text>
    <text x="1250" y="465" fill="#c4d1ec" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" text-anchor="middle">database</text>
  </g>

  <!-- Chroma Node -->
  <g>
    <rect x="1150" y="505" width="200" height="200" rx="24" fill="#0d1829" stroke="#8ab4f8" stroke-width="3" />
    <!-- Overlapping circles Chroma logo -->
    <g transform="translate(1250, 580) scale(2.2)">
      <!-- Blue Circle -->
      <circle cx="-7.5" cy="4" r="11" fill="#3b82f6" fill-opacity="0.85" />
      <!-- Yellow Circle -->
      <circle cx="7.5" cy="4" r="11" fill="#facc15" fill-opacity="0.85" />
      <!-- Red/Yellow Circle -->
      <circle cx="0" cy="-4" r="11" fill="#ef4444" fill-opacity="0.85" />
    </g>
    <text x="1250" y="750" fill="#c4d1ec" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" text-anchor="middle">Chroma</text>
    <text x="1250" y="775" fill="#c4d1ec" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" text-anchor="middle">vector store</text>
  </g>

</svg>
