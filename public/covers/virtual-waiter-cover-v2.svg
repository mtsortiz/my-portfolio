<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient (Red tinted) -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0204" />
      <stop offset="100%" stop-color="#24070d" />
    </linearGradient>
    
    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Grid Pattern -->
  <g opacity="0.18" stroke="#f43f5e" stroke-width="1.5">
    <path d="M0 180 H1600"/>
    <path d="M0 360 H1600"/>
    <path d="M0 540 H1600"/>
    <path d="M0 720 H1600"/>
    <path d="M200 0 V900"/>
    <path d="M400 0 V900"/>
    <path d="M600 0 V900"/>
    <path d="M800 0 V900"/>
    <path d="M1000 0 V900"/>
    <path d="M1200 0 V900"/>
    <path d="M1400 0 V900"/>
  </g>

  <!-- Connection Lines (Glowing Red) -->
  <path d="M 370 450 L 650 450" fill="none" stroke="#fb7185" stroke-width="5" filter="url(#glow)" />
  <path d="M 950 450 C 1050 450, 1070 295, 1150 295" fill="none" stroke="#fb7185" stroke-width="5" filter="url(#glow)" />
  <path d="M 950 450 C 1050 450, 1070 605, 1150 605" fill="none" stroke="#fb7185" stroke-width="5" filter="url(#glow)" />

  <!-- Client Node -->
  <g>
    <circle cx="300" cy="450" r="70" fill="#0d0305" stroke="#fb7185" stroke-width="4" filter="url(#glow)" />
    <text x="300" y="565" fill="#ffe4e6" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="600" text-anchor="middle">Client CLI</text>
  </g>

  <!-- LangGraph Waiter Node -->
  <g>
    <rect x="650" y="365" width="300" height="170" rx="24" fill="#3a0f18" stroke="#fb7185" stroke-width="4" filter="url(#glow)" />
    <text x="800" y="440" fill="#fff5f5" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="600" text-anchor="middle">LangGraph Router &amp;</text>
    <text x="800" y="480" fill="#fff5f5" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="600" text-anchor="middle">Waiter Agent (Bruno)</text>
  </g>

  <!-- Chroma DB Menu RAG Node -->
  <g>
    <rect x="1150" y="195" width="200" height="200" rx="24" fill="#0d0305" stroke="#fb7185" stroke-width="3" />
    <!-- Chroma logo -->
    <g transform="translate(1250, 275) scale(2.2)">
      <!-- Blue Circle -->
      <circle cx="-7.5" cy="4" r="11" fill="#3b82f6" fill-opacity="0.85" />
      <!-- Yellow Circle -->
      <circle cx="7.5" cy="4" r="11" fill="#facc15" fill-opacity="0.85" />
      <!-- Red Circle -->
      <circle cx="0" cy="-4" r="11" fill="#ef4444" fill-opacity="0.85" />
    </g>
    <text x="1250" y="440" fill="#ffe4e6" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" text-anchor="middle">Chroma DB</text>
    <text x="1250" y="465" fill="#ffe4e6" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" text-anchor="middle">menu RAG</text>
  </g>

  <!-- Notion API Node -->
  <g>
    <rect x="1150" y="505" width="200" height="200" rx="24" fill="#0d0305" stroke="#fb7185" stroke-width="3" />
    <!-- Notion Logo representation -->
    <g stroke="#fb7185" stroke-width="3" fill="none" transform="translate(1250, 580) scale(2.2)">
      <rect x="-15" y="-18" width="30" height="36" rx="4" fill="#3a0f18" stroke="#fb7185" stroke-width="2"/>
      <path d="M -9 10 L -9 -10 L 9 10 L 9 -10" stroke-width="3" stroke="#fb7185" stroke-linecap="round"/>
    </g>
    <text x="1250" y="750" fill="#ffe4e6" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" text-anchor="middle">Notion API</text>
    <text x="1250" y="775" fill="#ffe4e6" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" text-anchor="middle">order reports</text>
  </g>

</svg>
