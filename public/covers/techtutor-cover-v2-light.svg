<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient (Orange Tinted Light) -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffaf5" />
      <stop offset="100%" stop-color="#fcefe0" />
    </linearGradient>

    <!-- Subtle Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#3a1e0f" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Grid Pattern -->
  <g opacity="0.2" stroke="#e0a980" stroke-width="1.5">
    <path d="M0 180 H1600"/>
    <path d="M0 360 H1600"/>
    <path d="M0 540 H1600"/>
    <path d="M0 720 H1600"/>
    <path d="M200 0 V900"/>
    <path d="M400 0 V900"/>
    <path d="M600 0 V900"/>
    <path d="M800 0 V900"/>
    <path d="M1000 0 V900"/>
    <path d="M1200 0 V900"/>
    <path d="M1400 0 V900"/>
  </g>

  <!-- Connection Lines (Elegant Orange) -->
  <path d="M 370 450 L 650 450" fill="none" stroke="#ea580c" stroke-width="5" stroke-linecap="round" />
  <path d="M 950 450 L 1150 450" fill="none" stroke="#ea580c" stroke-width="5" stroke-linecap="round" />

  <!-- Student Node -->
  <g>
    <circle cx="300" cy="450" r="70" fill="#ffffff" stroke="#9a3412" stroke-width="4" filter="url(#shadow)" />
    <text x="300" y="565" fill="#9a3412" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="600" text-anchor="middle">Student</text>
  </g>

  <!-- Gradio & Gemini Agent Node -->
  <g>
    <rect x="650" y="365" width="300" height="170" rx="24" fill="#ea580c" stroke="#9a3412" stroke-width="2" filter="url(#shadow)" />
    <text x="800" y="440" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="600" text-anchor="middle">Gradio Chat &amp;</text>
    <text x="800" y="480" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="600" text-anchor="middle">Gemini 2.5 Flash</text>
  </g>

  <!-- Docs Web Scraper Node -->
  <g>
    <rect x="1150" y="350" width="200" height="200" rx="24" fill="#ffffff" stroke="#9a3412" stroke-width="3" filter="url(#shadow)" />
    <!-- Docs scraper icon -->
    <g stroke="#9a3412" stroke-width="3" fill="none" stroke-linecap="round" transform="translate(1250, 430) scale(2.2)">
      <rect x="-15" y="-20" width="30" height="40" rx="4" fill="#fefdfb" stroke="#9a3412" stroke-width="2"/>
      <line x1="-9" y1="-10" x2="9" y2="-10"/>
      <line x1="-9" y1="-2" x2="1" y2="-2"/>
      <line x1="-9" y1="6" x2="9" y2="6"/>
      <!-- Search glass over doc -->
      <circle cx="5" cy="5" r="6" stroke="#9a3412" stroke-width="2" fill="#fefdfb"/>
      <line x1="9" y1="9" x2="14" y2="14" stroke="#9a3412" stroke-width="2"/>
    </g>
    <text x="1250" y="595" fill="#9a3412" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" text-anchor="middle">BS4 Scraper</text>
    <text x="1250" y="620" fill="#9a3412" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" text-anchor="middle">docs retriever</text>
  </g>

</svg>
