<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient (Orange tinted) -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0502" />
      <stop offset="100%" stop-color="#241107" />
    </linearGradient>
    
    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Grid Pattern -->
  <g opacity="0.18" stroke="#f97316" stroke-width="1.5">
    <path d="M0 180 H1600"/>
    <path d="M0 360 H1600"/>
    <path d="M0 540 H1600"/>
    <path d="M0 720 H1600"/>
    <path d="M200 0 V900"/>
    <path d="M400 0 V900"/>
    <path d="M600 0 V900"/>
    <path d="M800 0 V900"/>
    <path d="M1000 0 V900"/>
    <path d="M1200 0 V900"/>
    <path d="M1400 0 V900"/>
  </g>

  <!-- Connection Lines (Glowing Orange) -->
  <path d="M 370 450 L 650 450" fill="none" stroke="#fb923c" stroke-width="5" filter="url(#glow)" />
  <path d="M 950 450 L 1150 450" fill="none" stroke="#fb923c" stroke-width="5" filter="url(#glow)" />

  <!-- Student Node -->
  <g>
    <circle cx="300" cy="450" r="70" fill="#0c0603" stroke="#fb923c" stroke-width="4" filter="url(#glow)" />
    <text x="300" y="565" fill="#ffedd5" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="600" text-anchor="middle">Student</text>
  </g>

  <!-- Gradio & Gemini Agent Node -->
  <g>
    <rect x="650" y="365" width="300" height="170" rx="24" fill="#3a1a09" stroke="#fb923c" stroke-width="4" filter="url(#glow)" />
    <text x="800" y="440" fill="#fffaf5" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="600" text-anchor="middle">Gradio Chat &amp;</text>
    <text x="800" y="480" fill="#fffaf5" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="600" text-anchor="middle">Gemini 2.5 Flash</text>
  </g>

  <!-- Docs Web Scraper Node -->
  <g>
    <rect x="1150" y="350" width="200" height="200" rx="24" fill="#0c0603" stroke="#fb923c" stroke-width="3" />
    <!-- Docs scraper icon -->
    <g stroke="#fb923c" stroke-width="3" fill="none" stroke-linecap="round" transform="translate(1250, 430) scale(2.2)">
      <rect x="-15" y="-20" width="30" height="40" rx="4" fill="#3a1a09" stroke="#fb923c" stroke-width="2"/>
      <line x1="-9" y1="-10" x2="9" y2="-10"/>
      <line x1="-9" y1="-2" x2="1" y2="-2"/>
      <line x1="-9" y1="6" x2="9" y2="6"/>
      <!-- Search glass over doc -->
      <circle cx="5" cy="5" r="6" stroke="#fb923c" stroke-width="2" fill="#3a1a09"/>
      <line x1="9" y1="9" x2="14" y2="14" stroke="#fb923c" stroke-width="2"/>
    </g>
    <text x="1250" y="595" fill="#ffedd5" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" text-anchor="middle">BS4 Scraper</text>
    <text x="1250" y="620" fill="#ffedd5" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" text-anchor="middle">docs retriever</text>
  </g>

</svg>
