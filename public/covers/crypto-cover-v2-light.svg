<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient (Green Tinted Light) -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4faf6" />
      <stop offset="100%" stop-color="#e1eee5" />
    </linearGradient>

    <!-- Subtle Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f2618" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Grid Pattern -->
  <g opacity="0.18" stroke="#40916c" stroke-width="1.5">
    <path d="M0 180 H1600"/>
    <path d="M0 360 H1600"/>
    <path d="M0 540 H1600"/>
    <path d="M0 720 H1600"/>
    <path d="M200 0 V900"/>
    <path d="M400 0 V900"/>
    <path d="M600 0 V900"/>
    <path d="M800 0 V900"/>
    <path d="M1000 0 V900"/>
    <path d="M1200 0 V900"/>
    <path d="M1400 0 V900"/>
  </g>

  <!-- Connection Lines (Elegant Green) -->
  <path d="M 370 450 L 650 450" fill="none" stroke="#40916c" stroke-width="5" stroke-linecap="round" />
  <path d="M 950 450 C 1050 450, 1070 295, 1150 295" fill="none" stroke="#40916c" stroke-width="5" stroke-linecap="round" />
  <path d="M 950 450 C 1050 450, 1070 605, 1150 605" fill="none" stroke="#40916c" stroke-width="5" stroke-linecap="round" />

  <!-- Client Node -->
  <g>
    <circle cx="300" cy="450" r="70" fill="#ffffff" stroke="#1b4332" stroke-width="4" filter="url(#shadow)" />
    <text x="300" y="565" fill="#1b4332" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="600" text-anchor="middle">Client</text>
  </g>

  <!-- FastAPI & LangGraph Agent Node -->
  <g>
    <rect x="650" y="365" width="300" height="170" rx="24" fill="#2d6a4f" stroke="#1b4332" stroke-width="2" filter="url(#shadow)" />
    <text x="800" y="440" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="600" text-anchor="middle">FastAPI &amp;</text>
    <text x="800" y="480" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="600" text-anchor="middle">LangGraph Agent</text>
  </g>

  <!-- yfinance API Node -->
  <g>
    <rect x="1150" y="195" width="200" height="200" rx="24" fill="#ffffff" stroke="#1b4332" stroke-width="3" filter="url(#shadow)" />
    <!-- Stock Chart Icon -->
    <g stroke="#1b4332" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" transform="translate(1250, 275) scale(2.2)">
      <path d="M -15 15 L 15 15" stroke-opacity="0.5"/>
      <path d="M -15 15 V -15" stroke-opacity="0.5"/>
      <path d="M -15 10 L -5 -5 L 5 2 L 15 -12" stroke-width="2" stroke="#1b4332"/>
      <circle cx="-15" cy="10" r="1.5" fill="#1b4332"/>
      <circle cx="-5" cy="-5" r="1.5" fill="#1b4332"/>
      <circle cx="5" cy="2" r="1.5" fill="#1b4332"/>
      <circle cx="15" cy="-12" r="1.5" fill="#1b4332"/>
    </g>
    <text x="1250" y="440" fill="#1b4332" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" text-anchor="middle">yfinance</text>
    <text x="1250" y="465" fill="#1b4332" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" text-anchor="middle">market API</text>
  </g>

  <!-- Chroma DB & FlashRank RAG Node -->
  <g>
    <rect x="1150" y="505" width="200" height="200" rx="24" fill="#ffffff" stroke="#1b4332" stroke-width="3" filter="url(#shadow)" />
    <!-- Chroma logo -->
    <g transform="translate(1250, 580) scale(2.2)">
      <!-- Blue Circle -->
      <circle cx="-7.5" cy="4" r="11" fill="#3b82f6" fill-opacity="0.85" />
      <!-- Yellow Circle -->
      <circle cx="7.5" cy="4" r="11" fill="#facc15" fill-opacity="0.85" />
      <!-- Red Circle -->
      <circle cx="0" cy="-4" r="11" fill="#ef4444" fill-opacity="0.85" />
    </g>
    <text x="1250" y="750" fill="#1b4332" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" text-anchor="middle">Chroma DB &amp;</text>
    <text x="1250" y="775" fill="#1b4332" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" text-anchor="middle">FlashRank RAG</text>
  </g>

</svg>
