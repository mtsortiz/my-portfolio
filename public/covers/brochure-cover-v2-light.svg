<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient (Purple Tinted Light) -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#faf5ff" />
      <stop offset="100%" stop-color="#ede1fa" />
    </linearGradient>

    <!-- Subtle Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#300f3a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Grid Pattern -->
  <g opacity="0.2" stroke="#b08fc7" stroke-width="1.5">
    <path d="M0 180 H1600"/>
    <path d="M0 360 H1600"/>
    <path d="M0 540 H1600"/>
    <path d="M0 720 H1600"/>
    <path d="M200 0 V900"/>
    <path d="M400 0 V900"/>
    <path d="M600 0 V900"/>
    <path d="M800 0 V900"/>
    <path d="M1000 0 V900"/>
    <path d="M1200 0 V900"/>
    <path d="M1400 0 V900"/>
  </g>

  <!-- Connection Lines (Elegant Purple) -->
  <path d="M 370 450 L 650 450" fill="none" stroke="#7e22ce" stroke-width="5" stroke-linecap="round" />
  <path d="M 950 450 C 1050 450, 1070 295, 1150 295" fill="none" stroke="#7e22ce" stroke-width="5" stroke-linecap="round" />
  <path d="M 950 450 C 1050 450, 1070 605, 1150 605" fill="none" stroke="#7e22ce" stroke-width="5" stroke-linecap="round" />

  <!-- Next.js UI Node -->
  <g>
    <circle cx="300" cy="450" r="70" fill="#ffffff" stroke="#6b21a8" stroke-width="4" filter="url(#shadow)" />
    <text x="300" y="565" fill="#6b21a8" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="600" text-anchor="middle">Next.js UI</text>
  </g>

  <!-- FastAPI & Gemini Agent Node -->
  <g>
    <rect x="650" y="365" width="300" height="170" rx="24" fill="#7e22ce" stroke="#6b21a8" stroke-width="2" filter="url(#shadow)" />
    <text x="800" y="440" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="600" text-anchor="middle">FastAPI Backend &amp;</text>
    <text x="800" y="480" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="600" text-anchor="middle">Gemini Generator</text>
  </g>

  <!-- BS4 Web Scraper Node -->
  <g>
    <rect x="1150" y="195" width="200" height="200" rx="24" fill="#ffffff" stroke="#6b21a8" stroke-width="3" filter="url(#shadow)" />
    <!-- Web spider/crawler representation -->
    <g stroke="#6b21a8" stroke-width="3" fill="none" transform="translate(1250, 280)">
      <path d="M -25 0 L 25 0"/>
      <path d="M 0 -25 L 0 25"/>
      <path d="M -18 -18 L 18 18"/>
      <path d="M -18 18 L 18 -18"/>
      <circle cx="0" cy="0" r="10" fill="#f4f6f8" stroke="#6b21a8" stroke-width="3"/>
      <circle cx="0" cy="0" r="20" stroke="#6b21a8" stroke-dasharray="3,3"/>
    </g>
    <text x="1250" y="440" fill="#6b21a8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" text-anchor="middle">BS4 Scraper</text>
    <text x="1250" y="465" fill="#6b21a8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" text-anchor="middle">web crawler</text>
  </g>

  <!-- Generated Brochure Node -->
  <g>
    <rect x="1150" y="505" width="200" height="200" rx="24" fill="#ffffff" stroke="#6b21a8" stroke-width="3" filter="url(#shadow)" />
    <!-- Brochure Document Icon -->
    <g stroke="#6b21a8" stroke-width="3" fill="none" stroke-linecap="round" transform="translate(1250, 580) scale(2.2)">
      <rect x="-15" y="-20" width="30" height="40" rx="4" fill="#f4f6f8" stroke="#6b21a8" stroke-width="2"/>
      <line x1="-9" y1="-10" x2="9" y2="-10"/>
      <line x1="-9" y1="-2" x2="4" y2="-2"/>
      <line x1="-9" y1="6" x2="9" y2="6"/>
      <line x1="-9" y1="14" x2="0" y2="14"/>
    </g>
    <text x="1250" y="750" fill="#6b21a8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" text-anchor="middle">Brochure PDF &amp;</text>
    <text x="1250" y="775" fill="#6b21a8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" text-anchor="middle">Markdown Output</text>
  </g>

</svg>
